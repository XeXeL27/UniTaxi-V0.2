spring.application.name=taxiuap
spring.profiles.active=${SPRING_PROFILES_ACTIVE:xexel}

# Puerto del servidor (API, panel en /admin y app en /app). En produccion el backend escucha en 5557 detras
# del proxy con el certificado: https://uni-taxi.uap.edu.bo. Con forward-headers las redirecciones y los
# enlaces usan el https y el dominio que manda el proxy (X-Forwarded-Proto / X-Forwarded-Host)
server.port=${SERVER_PORT:5557}
server.forward-headers-strategy=framework

# Base de datos: PostGIS en Docker (docker-compose.yml, puerto 5436). La contrasena viene del .env
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5436/taxiuap}
spring.datasource.username=${DB_USUARIO:postgres}
spring.datasource.password=${TAXIUAP_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate: el esquema lo genera Hibernate desde las entidades (solo agrega, nunca borra)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/La_Paz
spring.jackson.time-zone=America/La_Paz
# Carpeta de logs (logback-spring.xml): taxiuap.log, taxiuap-errores.log y los de dias anteriores
taxiuap.log.dir=${LOG_DIR:logs}

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION_MS:604800000}

# Administrador inicial (lo usa AdminInitializer, dominio identity)
admin.inicial.usuario=${ADMIN_USUARIO:admin}
admin.inicial.correo=${ADMIN_CORREO:}
admin.inicial.password=${ADMIN_PASSWORD:}

# CORS y WebSocket: origenes separados por coma (admite patrones como http://192.168.*.*:5173). Lo que
# sirve el mismo backend (/admin y /app) es del mismo origen y no necesita estar aqui
cors.origenes=${CORS_ORIGENES:https://uni-taxi.uap.edu.bo,http://uni-taxi.uap.edu.bo,http://virtual.uap.edu.bo:5557}

# Datos de prueba: solo el perfil xexel lo pone en true (ver seed/DataSeeder)
taxiuap.seed.habilitado=${SEED_HABILITADO:false}

# Precio fijo del viaje en Bs. Vacio: el precio sale de la tarifa vigente (distancia y tiempo)
taxiuap.viaje.precio-fijo=${PRECIO_FIJO_VIAJE:8.00}

# Descuento estudiantil (regla de negocio 3): apagado mientras el precio del viaje sea fijo
taxiuap.descuento-estudiantil.habilitado=${DESCUENTO_ESTUDIANTIL:false}

# Un conductor cuenta como "en linea" para el mapa del pasajero si reporto su GPS hace menos de esto
taxiuap.conductores.segundos-en-linea=${SEGUNDOS_EN_LINEA:120}

# Porcentaje de comision que la plataforma cobra por viaje. Por ahora 0: todo el pago queda al conductor
taxiuap.comision.porcentaje=${COMISION_PORCENTAJE:0}

# Archivos subidos (PDF de documentos de conductor): carpeta del servidor y limites de subida
taxiuap.archivos.directorio=${ARCHIVOS_DIRECTORIO:${user.home}/taxiuap-archivos}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=40MB

# Google OAuth2 (login con Google); los valores vienen del .env de la raiz (bootRun lo carga)
google.client-id=${GOOGLE_CLIENT_ID:}
google.client-secret=${GOOGLE_CLIENT_SECRET:}
google.redirect-uri=${GOOGLE_REDIRECT_URI:https://uni-taxi.uap.edu.bo/api/auth/google/callback}

# Lectura del carnet, la licencia y la foto con el carnet: primero Claude (Sonnet 5.5, salida
# estructurada; claude-haiku-4-5 es mas barato pero leia mal numeros y apellidos) y, si no responde o falta su llave, Gemini. Las llaves solo en el .env del servidor.
taxiuap.claude.api-key=${ANTHROPIC_API_KEY:}
taxiuap.claude.modelo=${CLAUDE_MODELO:claude-sonnet-5-5}
taxiuap.claude.segundos-espera=${CLAUDE_SEGUNDOS_ESPERA:25}

# Gemini, respaldo de Claude (la llave solo en el servidor). gemini-flash-latest es el alias del Flash
# mas nuevo; sin ninguna de las dos llaves la app lee con ML Kit en el telefono
taxiuap.gemini.api-key=${GEMINI_API_KEY:}
taxiuap.gemini.modelo=${GEMINI_MODELO:gemini-flash-latest}
taxiuap.gemini.url=${GEMINI_URL:https://generativelanguage.googleapis.com/v1beta}
taxiuap.gemini.lecturas-por-hora=${GEMINI_LECTURAS_POR_HORA:40}

# Correo saliente (credenciales al registrarse o al aprobar un conductor, codigo para restablecer la
# contrasena). Sin usuario configurado no se envia nada: el correo solo queda en el log
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USUARIO:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=15000
taxiuap.correo.remitente-nombre=${MAIL_REMITENTE:Unitaxi}
# Direccion publica del servidor: el enlace "Iniciar sesion" de los correos apunta a <url>/ingresar
taxiuap.url-publica=${URL_PUBLICA:https://uni-taxi.uap.edu.bo}
