plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.taxiuap'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	implementation 'org.hibernate.orm:hibernate-spatial'
	implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
	// Notificaciones push (FCM) al telefono aunque la app este cerrada
	implementation 'com.google.firebase:firebase-admin:9.4.3'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-websocket-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
}

// bootRun carga las variables del .env de la raiz del monorepo (la misma que usa docker compose),
// para que el backend lea GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET sin exportarlas a mano.
tasks.named('bootRun') {
	def archivoEnv = file('../.env')
	if (archivoEnv.exists()) {
		def vars = [:]
		archivoEnv.eachLine { linea ->
			def limpia = linea.trim()
			if (limpia && !limpia.startsWith('#') && limpia.contains('=')) {
				def partes = limpia.split('=', 2)
				def valor = partes[1].trim()
				// Valores entre comillas (rutas con espacios, como "SISTEMAS 2026"): sin las comillas.
				if (valor.length() >= 2 && ((valor.startsWith('"') && valor.endsWith('"')) || (valor.startsWith("'") && valor.endsWith("'")))) {
					valor = valor.substring(1, valor.length() - 1)
				}
				vars[partes[0].trim()] = valor
			}
		}
		environment vars
	}
}
